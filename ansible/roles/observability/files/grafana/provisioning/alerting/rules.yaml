apiVersion: 1
groups:
  - orgId: 1
    name: saude-pipeline
    folder: Observabilidade
    interval: 1m
    rules:
      - uid: comp-fora-do-ar
        title: "Componente fora do ar"
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "Componente fora do ar"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: mimir
            model:
              refId: A
              expr: 'up{job=~"loki|tempo|mimir|grafana"} == bool 0'
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [0]}}]}

      - uid: logs-parados-app-1-a
        title: "Pipeline de logs parado (app-1-a)"
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: "Pipeline de logs parado no app-1-a"
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: loki
            model:
              refId: A
              expr: 'absent_over_time({service="app", host="app-1-a"}[5m])'
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [0]}}]}

      - uid: alloy-nao-entrega
        title: "Alloy/Fluent Bit não entrega"
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Fluent Bit com retries persistentes"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: mimir
            model:
              refId: A
              expr: 'rate(fluentbit_output_retries_total[5m]) > bool 0'
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [0]}}]}

      - uid: alloy-descarte
        title: "Descarte no Alloy"
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "Alloy descartando bytes para o Loki"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: mimir
            model:
              refId: A
              expr: 'increase(loki_write_dropped_bytes_total[5m]) > bool 0'
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [0]}}]}

      - uid: disco-ec2
        title: "Disco da EC2 < 15%"
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "Disco da EC2 abaixo de 15% livre"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: mimir
            model:
              refId: A
              expr: 'node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < bool 0.15'
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [0]}}]}

      - uid: memoria-limite
        title: "Memória perto do limite (>85%)"
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Componente da stack usando >85% do mem_limit"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: mimir
            model:
              refId: A
              expr: |
                (
                  process_resident_memory_bytes{job="alloy"}   / (768  * 1024 * 1024) > bool 0.85
                  or
                  process_resident_memory_bytes{job="loki"}    / (1024 * 1024 * 1024) > bool 0.85
                  or
                  process_resident_memory_bytes{job="tempo"}   / (1024 * 1024 * 1024) > bool 0.85
                  or
                  process_resident_memory_bytes{job="mimir"}   / (1024 * 1024 * 1024) > bool 0.85
                  or
                  process_resident_memory_bytes{job="grafana"} / (512  * 1024 * 1024) > bool 0.85
                )
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [0]}}]}

      - uid: requisicao-lenta
        title: "Requisição lenta (p95 2x acima do normal)"
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "p95 de {{ .Labels.http_route }} {{ printf \"%.1f\" .Values.B.Value }}x acima da última hora"
        data:
          - refId: A
            relativeTimeRange: {from: 4200, to: 0}
            datasourceUid: mimir
            model:
              refId: A
              expr: |
                (
                  histogram_quantile(0.95, sum by (le, http_route) (rate(http_server_request_duration_seconds_bucket{http_route!="/api/health"}[5m])))
                  /
                  histogram_quantile(0.95, sum by (le, http_route) (rate(http_server_request_duration_seconds_bucket{http_route!="/api/health"}[1h] offset 5m)))
                ) > 2
                and
                histogram_quantile(0.95, sum by (le, http_route) (rate(http_server_request_duration_seconds_bucket{http_route!="/api/health"}[5m]))) > 0.2
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [0]}}]}
