apiVersion: 1
contactPoints:
  - orgId: 1
    name: sns-email
    receivers:
      - uid: sns-email
        type: sns
        settings:
          topic_arn: ${SNS_TOPIC_ARN}
          sigv4:
            region: ${AWS_REGION}
          subject: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
          message: |
            {{ range .Alerts }}{{ .Annotations.summary }}
            Início: {{ .StartsAt.Format "02/01 15:04" }} UTC
            {{ .GeneratorURL }}
            {{ end }}
